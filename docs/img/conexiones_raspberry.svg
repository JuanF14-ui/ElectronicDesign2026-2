<text x="60" y="788" font-size="14" fill="#374151">Rieles de la protoboard: pin 4 → riel de 5 V y pin 39 → riel de GND (casi todos los demás 5 V y GND de la Pi están dañados).</text>
<text x="60" y="812" font-size="14" fill="#374151">LCD: VSS, RW y K a GND · VDD y A a 5 V · V0 a la pata central de un potenciómetro de 10 kΩ (extremos a 5 V y GND).</text>
<text x="60" y="836" font-size="14" fill="#374151">RW siempre a GND: la LCD solo recibe datos y nunca le aplica 5 V a un GPIO (la Pi solo aguanta 3,3 V).</text>
<text x="60" y="860" font-size="14" fill="#374151">I2C por software (bus 3): dtoverlay=i2c-gpio,bus=3,i2c_gpio_sda=5,i2c_gpio_scl=6 en /boot/firmware/config.txt</text>
